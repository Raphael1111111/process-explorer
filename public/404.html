<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Weiterleitung...</title>
    <script>
      (function () {
        const redirectPath = window.location.pathname + window.location.search + window.location.hash;
        sessionStorage.setItem("spa-redirect-path", redirectPath);
        window.location.replace("/");
      })();
    </script>
  </head>
  <body></body>
</html>
